<style>
:root{--bg:#0D0F12;--card:#14171D;--elev:#1A1E26;--line:rgba(255,255,255,.1);--neon:#A6FF00;--tx:#F3F5F8;--mute:rgba(243,245,248,.64)}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:90px}
body{font:400 16px/1.6 'Plus Jakarta Sans',system-ui,sans-serif;color:var(--tx);background-color:var(--bg);background-image:linear-gradient(to right,rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px);background-size:44px 44px;overflow-x:hidden;padding-bottom:calc(110px + env(safe-area-inset-bottom))}
h1,h2,h3,.brand{font-family:'Space Grotesk',system-ui,sans-serif;letter-spacing:-.02em}
a{color:inherit}
:focus-visible{outline:3px solid var(--neon);outline-offset:3px}
.glow{position:fixed;border-radius:50%;filter:blur(110px);pointer-events:none;z-index:0;animation:drift 18s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(40px,-30px) scale(1.08)}}
.wrap{position:relative;z-index:1;max-width:1080px;margin:0 auto;padding:0 20px}
header.top{position:sticky;top:10px;z-index:40;margin:10px 12px 0}
.bar{max-width:1080px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;height:62px;padding:0 14px;background:rgba(20,23,29,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;text-decoration:none}
.logo{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--neon);overflow:hidden;flex:none}
.logo img{width:100%;height:100%;object-fit:cover;display:block}
.logo svg{width:24px;height:24px}
.nav{display:flex;gap:26px;font-size:15px;font-weight:500}
.nav a{text-decoration:none;color:var(--mute)}.nav a:hover{color:var(--tx)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:12px;font:700 14px 'Plus Jakarta Sans',sans-serif;border:1px solid var(--neon);background:var(--neon);color:#0D0F12;cursor:pointer;text-decoration:none;transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 22px -6px rgba(166,255,0,.45)}
.btn.g{background:rgba(255,255,255,.04);color:var(--tx);border-color:rgba(255,255,255,.16)}
.btn.g:hover{border-color:var(--neon);box-shadow:none}
.btn.big{padding:14px 24px;font-size:15px}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hero{padding:56px 0 48px}
.hero .wrap{display:grid;grid-template-columns:1.05fr .95fr;gap:48px;align-items:center}
h1{font-size:clamp(38px,6.4vw,68px);line-height:1.04}
h1 span{display:block}
.sub{max-width:46ch;margin:18px 0 26px;font-size:18px;color:var(--mute)}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.panel{background:linear-gradient(165deg,rgba(26,30,38,.9),rgba(20,23,29,.95));border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 40px -14px rgba(0,0,0,.7);position:relative;transition:border-color .25s,box-shadow .25s}
.panel:hover{border-color:rgba(166,255,0,.35)}
.tilt::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .25s;background:radial-gradient(240px circle at var(--gx,50%) var(--gy,50%),rgba(166,255,0,.1),transparent 75%)}
.tilt:hover::after{opacity:1}
.dbar,.pvbar{display:flex;align-items:center;gap:7px;padding:11px 14px;border-bottom:1px solid var(--line);background:rgba(13,15,18,.8);border-radius:18px 18px 0 0;font-size:13px;color:var(--mute)}
.dbar i,.pvbar i{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.18)}
.dbar span,.pvbar span{margin-left:8px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line)}
.tabs button{padding:11px 6px;border:0;background:none;color:var(--mute);font:600 13px 'Plus Jakarta Sans',sans-serif;cursor:pointer}
.tabs button[aria-selected=true]{background:var(--neon);color:#0D0F12}
.dbody{padding:16px}
.sk{display:grid;gap:9px;padding:14px;border:1.5px dashed rgba(255,255,255,.16);border-radius:12px;background:rgba(13,15,18,.6)}
.r{display:flex;align-items:center;gap:8px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.g2{display:grid;grid-template-columns:.8fr 1.2fr;gap:12px}
.col{display:grid;gap:8px;align-content:start}
.b{display:block;border-radius:6px;background:rgba(255,255,255,.1)}.b.n{background:rgba(166,255,0,.4)}
.dact{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}.dact .btn{flex:1}
.mq{position:relative;z-index:1;border-block:1px solid var(--line);background:rgba(20,23,29,.85);overflow:hidden;padding:11px 0;font-size:14px;color:var(--mute);display:flex}
.mt{display:flex;flex:none;min-width:100%;gap:34px;padding-right:34px;align-items:center;white-space:nowrap;animation:mq 34s linear infinite}
.mq:hover .mt{animation-duration:80s}
@keyframes mq{to{transform:translateX(-100%)}}
.mt b{color:var(--tx);font-weight:600}
section.s{padding:72px 0}
h2{font-size:clamp(26px,4vw,38px);line-height:1.15;margin-bottom:10px}
.lead{color:var(--mute);max-width:54ch}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:20px;margin-top:34px}
.card{padding:26px;display:flex;flex-direction:column;gap:12px;transition:transform .2s,border-color .25s}
.card .ic{width:46px;height:46px;border-radius:12px;background:rgba(166,255,0,.12);border:1px solid rgba(166,255,0,.35);color:var(--neon);display:grid;place-items:center}
.card .ic svg{width:22px;height:22px}
.card small{color:var(--neon);font-size:13px;font-weight:600}
.card p{color:var(--mute);flex:1}
.card .dact{margin:6px 0 0}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips span{padding:4px 10px;border:1px solid var(--line);border-radius:999px;font-size:12px;font-weight:600;color:var(--mute);background:rgba(13,15,18,.6)}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:26px;margin-top:34px;list-style:none;padding:0;counter-reset:s}
.steps li{counter-increment:s;border-top:2px solid var(--line);padding-top:16px;color:var(--mute)}
.steps li::before{content:counter(s);display:block;font:700 38px/1 'Space Grotesk',sans-serif;color:var(--neon);margin-bottom:8px}
.steps b{display:block;color:var(--tx);font:700 18px 'Space Grotesk',sans-serif}
details{margin-top:12px;overflow:hidden}
summary{cursor:pointer;padding:18px 20px;font:700 17px 'Space Grotesk',sans-serif;list-style:none;display:flex;justify-content:space-between;gap:16px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-size:22px;line-height:1;color:var(--neon);transition:transform .25s}
details[open] summary::after{transform:rotate(45deg)}
details p{padding:0 20px 18px;color:var(--mute)}
details p a{color:var(--neon);text-underline-offset:3px}
footer{position:relative;z-index:1;padding:30px 0 16px;border-top:1px solid var(--line);background:rgba(20,23,29,.7)}
footer .wrap{display:flex;flex-wrap:wrap;gap:18px;justify-content:space-between;align-items:center}
.soc{display:flex;gap:18px;flex-wrap:wrap;font-weight:500;color:var(--mute)}.soc a:hover{color:var(--neon)}
.copy{width:100%;color:var(--mute);font-size:14px}
.dock{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;display:flex;gap:4px;padding:6px;background:rgba(20,23,29,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:20px;box-shadow:0 18px 40px -8px rgba(0,0,0,.85);max-width:calc(100% - 16px)}
.pill{position:absolute;top:6px;bottom:6px;left:0;width:0;background:var(--neon);border-radius:14px;transition:transform .3s cubic-bezier(.22,1,.36,1),width .3s;pointer-events:none}
.dock a{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:66px;padding:8px 12px;border-radius:14px;color:var(--mute);font:600 12px 'Plus Jakarta Sans',sans-serif;text-decoration:none;transition:color .2s}

dialog{margin:auto;padding:0;border:1px solid var(--line);border-radius:18px;background:var(--card);color:var(--tx);width:calc(100% - 28px);max-width:560px;max-height:92vh;overflow:auto}
dialog::backdrop{background:rgba(5,6,8,.78)}
#soon{max-width:390px;padding:30px;text-align:center}

.pvb{padding:18px}.note{color:var(--mute);font-size:14px;margin:14px 0}
.pvb .sk{padding:20px;min-height:220px}
.mv{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:12px;border:1px solid var(--line);background:#0D0F12;overflow:hidden}

.hr{display:flex;gap:8px;align-items:center}

.ct{padding:0 20px 20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.ctc,.soc a{display:flex;align-items:center;text-decoration:none}
.ctc{gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:rgba(13,15,18,.55);transition:border-color .2s,transform .2s}
.ctc:hover{border-color:var(--neon);transform:translateY(-2px)}
.ic2{width:38px;height:38px;border-radius:10px;background:rgba(166,255,0,.12);border:1px solid rgba(166,255,0,.35);color:var(--neon);display:grid;place-items:center;flex:none}
.ctc small{display:block;color:var(--mute);font-size:12px;line-height:1.2}
.ctc b{display:block;font-size:15px;line-height:1.35;word-break:break-all}
.soc a{gap:8px;padding:8px 12px;border:1px solid var(--line);border-radius:12px;font-size:14px}
/* halaman aplikasi */
.page{padding:40px 0 20px}
.crumb{display:flex;gap:8px;flex-wrap:wrap;font-size:14px;color:var(--mute);margin-bottom:22px}
.crumb a{text-decoration:none}.crumb a:hover{color:var(--neon)}
.ahead{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.aico{width:84px;height:84px;border-radius:22px;display:grid;place-items:center;flex:none;background:var(--elev);border:2px solid var(--ac,var(--neon));color:var(--ac,var(--neon))}
.aico svg{width:38px;height:38px}
.ahead h1{font-size:clamp(30px,5vw,46px);min-height:0}
.ahead .meta{color:var(--mute);font-size:15px}
.layout{display:grid;grid-template-columns:1.4fr 1fr;gap:28px;margin-top:30px;align-items:start}
.box{padding:22px}
.box h2{font-size:20px;margin-bottom:14px}
.spec{display:grid;grid-template-columns:auto 1fr;gap:0 18px;font-size:15px}
.spec dt,.spec dd{padding:10px 0;border-bottom:1px solid var(--line)}
.spec dt{color:var(--mute)}.spec dd{font-weight:600;text-align:right;word-break:break-word}
.spec dt:last-of-type,.spec dd:last-of-type{border-bottom:0}
.hash{font:500 12px/1.5 ui-monospace,Menlo,monospace;word-break:break-all}
.list{padding-left:20px;color:var(--mute);display:grid;gap:6px}
.stack{display:grid;gap:22px}
.mini{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:14px;text-decoration:none;transition:border-color .2s}
.mini:hover{border-color:var(--neon)}
.mini .ic2{width:42px;height:42px}
.mini small{display:block;color:var(--mute);font-size:12px}
@media(max-width:820px){.hero .wrap{grid-template-columns:1fr;gap:36px}.nav{display:none}section.s{padding:54px 0}.layout{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
</style>
</head>

</dialog>

<script>
(function(){
var C=CONFIG,$=function(s){return document.querySelector(s)},$$=function(s){return Array.prototype.slice.call(document.querySelectorAll(s))};

var DL='<svg class="i" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>';

/* logo + brand + footer */
var cloud='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16a3.5 3.5 0 0 1 .8-6.9A5 5 0 0 1 16.5 9 3.5 3.5 0 0 1 17 16z" fill="#0D0F12"/></svg>';
$$('[data-logo]').forEach(function(e){e.innerHTML=C.LOGO_SRC?'<img src="'+esc(C.LOGO_SRC)+'" alt="Logo '+esc(C.brand)+'">':cloud});

var IC={ig:'<rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><path d="M17.5 6.5h.01"/>',tt:'<path d="M9 12a4 4 0 1 0 4 4V4a5 5 0 0 0 5 5"/>'};
var CT=C.instagram.map(function(h){return{k:'ig',n:'Instagram',h:h,u:'https://instagram.com/'+h}}).concat([{k:'tt',n:'TikTok',h:C.tiktok,u:'https://tiktok.com/@'+C.tiktok}]);
$('#soc').innerHTML=CT.map(function(c){return'<a href="'+esc(c.u)+'" target="_blank" rel="noopener" aria-label="'+c.n+' '+esc(c.h)+'"><svg class="i" viewBox="0 0 24 24">'+IC[c.k]+'</svg>'+esc(c.h)+'</a>'}).join('');
$('#copy').textContent='\u00A9 '+new Date().getFullYear()+' '+C.brand+'. Semua hak dilindungi.';

/* ---------- sketsa & media pratinjau ---------- */
function bl(w,h,n){return'<i class="b'+(n?' n':'')+'" style="width:'+w+'%;height:'+h+'px"></i>'}
function row(){return'<div class="r">'+Array.prototype.join.call(arguments,'')+'</div>'}
function tiles(n,hi){var s='';for(var i=0;i<n;i++)s+='<i class="b'+(i===hi?' n':'')+'" style="height:50px"></i>';return'<div class="g4">'+s+'</div>'}
var SK={
 sosmed:function(){return'<div class="sk">'+row(bl(20,12,1),bl(12,8),bl(12,8),bl(12,8))+bl(72,20)+bl(46,10)+row(bl(18,22,1),bl(18,22),bl(18,22))+row(bl(8,10),bl(48,10),bl(20,10,1))+row(bl(8,10),bl(48,10),bl(20,10,1))+'</div>'},
 topup:function(){return'<div class="sk">'+row(bl(20,12,1),bl(46,18))+tiles(4,1)+tiles(4,6)+row(bl(34,10),bl(22,18,1))+'</div>'},
 otp:function(){return'<div class="sk">'+row(bl(20,12,1),bl(14,8),bl(14,8))+'<div class="g2"><div class="col">'+bl(90,10)+bl(70,10)+bl(80,10)+bl(60,10)+'</div><div class="col">'+row(bl(44,10),bl(18,20,1))+row(bl(44,10),bl(18,20,1))+row(bl(44,10),bl(18,20,1))+'</div></div></div>'}
};
function media(s,big){
 var p=(s.preview||'').trim();
 if(!p)return SK[s.kind]();
 var y=p.match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/);
 if(y)return big?'<div class="mv"><iframe src="https://www.youtube-nocookie.com/embed/'+y[1]+'" title="Pratinjau '+esc(s.name)+'" allow="encrypted-media;picture-in-picture;fullscreen" allowfullscreen loading="lazy"></iframe></div>':'<img class="mv" src="https://img.youtube.com/vi/'+y[1]+'/hqdefault.jpg" alt="Pratinjau '+esc(s.name)+'">';
 if(/\.(mp4|webm|mov|m4v|ogv)(\?|#|$)/i.test(p))return'<video class="mv" src="'+esc(p)+'" playsinline '+(big?'controls autoplay muted':'muted loop autoplay')+'></video>';
 return'<img class="mv" src="'+esc(p)+'" alt="Pratinjau '+esc(s.name)+'" loading="lazy">';
}

/* ---------- tombol download MediaFire ---------- */
function hasDl(a){return!!(a.mediafire&&a.mediafire.trim())}
function dlBtn(a,cls){
 return hasDl(a)
  ?'<a class="btn '+(cls||'')+'" href="'+esc(a.mediafire.trim())+'" target="_blank" rel="noopener noreferrer">'+DL+'Download di MediaFire</a>'
  :'<button class="btn '+(cls||'')+'" type="button" data-soon>'+DL+'Segera Hadir</button>';
}

/* ---------- VIEW: beranda ---------- */
function homeView(){
 return '<section class="hero" id="home"><div class="wrap"><div>'+
 '<h1 aria-label="Semua layanan Sora. Satu pintu."><span>Semua layanan Sora.</span><span>Satu pintu.</span></h1>'+
 '<p class="sub">SoraPay menghubungkan suntik sosmed, topup, dan nomor kosong. Pilih layanan, lihat gambaran tampilannya, lalu buka webnya.</p>'+
 '<div class="cta"><a class="btn" href="#layanan" data-link>Lihat layanan</a><a class="btn g" href="/aplikasi" data-link><svg class="i" viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M12 7v7m-3-3 3 3 3-3"/></svg>Unduh APK</a></div></div>'+
 '<div class="panel tilt" id="deck"><div class="dbar"><i></i><i></i><i></i><span id="durl"></span></div><div class="tabs" id="tabs" role="tablist"></div><div class="dbody"><div id="dsk"></div><div class="dact" id="dact"></div></div></div>'+
 '</div></section>'+
 '<div class="mq" aria-hidden="true"><div class="mt" id="m1"></div><div class="mt" id="m2"></div></div>'+
 '<section class="s" id="layanan"><div class="wrap"><h2>Tiga web, satu pintu masuk</h2><p class="lead">Tekan Pratinjau untuk melihat gambaran tampilan awalnya, atau langsung buka webnya di tab baru.</p><div class="cards" id="cards"></div></div></section>'+
 '<section class="s" id="cara"><div class="wrap"><h2>Cara pakainya</h2><ol class="steps"><li><b>Pilih layanan</b>Tentukan kebutuhanmu: sosmed, topup, atau nomor OTP.</li><li><b>Lihat pratinjau, lalu buka web</b>Pratinjau memberi gambaran tampilan. Setelah yakin, buka webnya di tab baru.</li><li><b>Pesan dan bayar di web tujuan</b>Metode bayar mengikuti halaman masing-masing layanan.</li></ol></div></section>'+
 '<section class="s" id="faq"><div class="wrap" style="max-width:760px"><h2>Pertanyaan yang sering muncul</h2>'+
 '<details class="panel" open><summary>Apa itu SoraPay?</summary><p>Satu halaman yang menghubungkan web suntik sosmed, topup, dan nomor kosong, jadi kamu tidak perlu mengingat banyak alamat.</p></details>'+
 '<details class="panel"><summary>Apa bedanya Pratinjau dan Buka web?</summary><p>Pratinjau hanya sketsa tampilan awal supaya kamu tahu isi webnya. Buka web langsung membawamu ke web aslinya di tab baru.</p></details>'+
 '<details class="panel"><summary>Di mana aplikasinya?</summary><p>Buka halaman <a href="/aplikasi" data-link>Aplikasi</a>, pilih aplikasinya, lalu unduh APK lewat MediaFire.</p></details>'+
 '<details class="panel" open><summary>Bagaimana cara menghubungi kami?</summary><div class="ct" id="contact"></div></details></div></section>';
}
var cur=0;
function deck(i){
 cur=i;var s=C.services[i];
 $('#tabs').innerHTML=C.services.map(function(x,k){return'<button role="tab" aria-selected="'+(k===i)+'" data-i="'+k+'">'+esc(x.name)+'</button>'}).join('');
 $('#durl').textContent=host(s.url);
 $('#dsk').innerHTML=media(s,false);
 $('#dact').innerHTML='<button class="btn" type="button" data-pv="'+i+'">Pratinjau</button><a class="btn g" href="'+esc(s.url)+'" target="_blank" rel="noopener noreferrer">Buka web</a>';
}
function homeInit(){
 $('#tabs').addEventListener('click',function(e){var b=e.target.closest('button');if(b)deck(+b.dataset.i)});
 deck(0);
 $('#cards').innerHTML=C.services.map(function(s,i){
  return'<article class="panel tilt card"><div class="ic"><svg class="i" viewBox="0 0 24 24">'+ICONS[s.icon]+'</svg></div><div><h3>'+esc(s.name)+'</h3><small>'+esc(host(s.url))+'</small></div><p>'+esc(s.desc)+'</p><div class="dact"><button class="btn g" type="button" data-pv="'+i+'">Pratinjau</button><a class="btn" href="'+esc(s.url)+'" target="_blank" rel="noopener noreferrer">Buka web</a></div></article>'}).join('');
 var mq=C.services.map(function(s){return'<b>'+esc(host(s.url))+'</b><span>'+esc(s.tag)+'</span>'}).join('')+'<span>Satu pintu untuk semua layanan Sora</span>';
 $('#m1').innerHTML=mq;$('#m2').innerHTML=mq;
 $('#contact').innerHTML=CT.map(function(c){return'<a class="ctc" href="'+esc(c.u)+'" target="_blank" rel="noopener"><span class="ic2"><svg class="i" viewBox="0 0 24 24">'+IC[c.k]+'</svg></span><span><small>'+c.n+'</small><b>'+esc(c.h)+'</b></span></a>'}).join('');
 if('IntersectionObserver' in window){
  spy=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting)setAct(e.target.id)})},{rootMargin:'-40% 0px -50% 0px'});
  ['home','layanan','faq'].forEach(function(id){spy.observe(document.getElementById(id))});
 }
}

/* ---------- VIEW: daftar aplikasi ---------- */
function listView(){
 return '<section class="page"><div class="wrap"><nav class="crumb" aria-label="Breadcrumb"><a href="/" data-link>Beranda</a><span>/</span><span>Aplikasi</span></nav>'+
 '<h1 style="font-size:clamp(32px,5vw,48px);margin-bottom:8px">Aplikasi Android</h1><p class="lead">Unduh APK resmi '+esc(C.brand)+'. Pilih aplikasi untuk melihat spesifikasi lengkapnya sebelum mengunduh.</p>'+
 '<div class="cards">'+C.apps.map(function(a){
  return'<article class="panel tilt card" style="--ac:'+a.accent+'"><div class="ic" style="color:'+a.accent+';border-color:'+a.accent+'66;background:'+a.accent+'1f"><svg class="i" viewBox="0 0 24 24">'+ICONS[a.icon]+'</svg></div>'+
  '<div><h3>'+esc(a.name)+'</h3><small style="color:'+a.accent+'">'+esc(a.category)+'</small></div><p>'+esc(a.desc)+'</p>'+
  '<div class="chips"><span>v'+esc(a.version)+'</span><span>'+dash(a.size)+'</span><span>Android '+esc(a.minAndroid)+'+</span></div>'+
  '<div class="dact"><a class="btn g" href="/aplikasi/info/'+esc(a.slug)+'" data-link>Lihat info</a>'+dlBtn(a)+'</div></article>'}).join('')+'</div></div></section>';
}

/* ---------- VIEW: detail aplikasi ---------- */
function appView(a){
 var rows=[['Nama APK',dash(a.apkName)],['Developer',dash(C.developer)],['Package',dash(a.packageName)],['Versi',dash(a.version)],['Ukuran file',dash(a.size)],['Android minimum',dash(a.minAndroid)+(a.minAndroid?' ke atas':'')],['Arsitektur',dash(a.arch)],['Bahasa',dash(a.lang)],['Harga',dash(a.price)],['Tanggal rilis',dash(a.updated)],['Sumber unduhan','MediaFire']];
 var sha=(a.sha256||'').trim();
 var others=C.apps.filter(function(x){return x!==a});
 return '<section class="page"><div class="wrap">'+
 '<nav class="crumb" aria-label="Breadcrumb"><a href="/" data-link>Beranda</a><span>/</span><a href="/aplikasi" data-link>Aplikasi</a><span>/</span><span>'+esc(a.name)+'</span></nav>'+
 '<div class="ahead" style="--ac:'+a.accent+'"><div class="aico"><svg class="i" viewBox="0 0 24 24">'+ICONS[a.icon]+'</svg></div>'+
 '<div style="flex:1;min-width:220px"><h1>'+esc(a.name)+'</h1><p class="meta">'+esc(a.category)+' &middot; oleh '+esc(C.developer)+'</p></div>'+dlBtn(a,'big')+'</div>'+
 '<div class="layout"><div class="stack">'+
 '<div class="panel box"><h2>Tentang aplikasi</h2><p style="color:var(--mute)">'+esc(a.desc)+'</p><ul class="list" style="margin-top:14px">'+a.features.map(function(f){return'<li>'+esc(f)+'</li>'}).join('')+'</ul></div>'+
 '<div class="panel box"><h2>Catatan rilis (v'+esc(a.version)+')</h2><ul class="list">'+a.changelog.map(function(f){return'<li>'+esc(f)+'</li>'}).join('')+'</ul></div>'+
 '<div class="panel box"><h2>Izin akses Android</h2><ul class="list">'+a.permissions.map(function(f){return'<li>'+esc(f)+'</li>'}).join('')+'</ul></div>'+
 '<div class="panel box"><h2>Cara memasang</h2><ol class="list"><li>Tekan Download, lalu unduh file APK di halaman MediaFire.</li><li>Buka file APK dari folder Downloads.</li><li>Jika diminta, izinkan pemasangan dari sumber ini di Setelan.</li><li>Ketuk Instal, lalu buka aplikasinya.</li></ol></div>'+
 '</div><aside class="stack"><div class="panel box"><h2>Spesifikasi</h2><dl class="spec">'+rows.map(function(r){return'<dt>'+r[0]+'</dt><dd>'+r[1]+'</dd>'}).join('')+'</dl>'+
 '<div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--line)"><div style="font-weight:600;margin-bottom:6px">SHA-256</div><div class="hash" style="color:var(--mute)">'+(sha?esc(sha):'Belum diisi')+'</div></div></div>'+
 (others.length?'<div class="panel box"><h2>Aplikasi lain</h2><div class="stack" style="gap:10px">'+others.map(function(o){return'<a class="mini" href="/aplikasi/info/'+esc(o.slug)+'" data-link><span class="ic2" style="color:'+o.accent+'"><svg class="i" viewBox="0 0 24 24">'+ICONS[o.icon]+'</svg></span><span><b>'+esc(o.name)+'</b><small>'+esc(o.category)+'</small></span></a>'}).join('')+'</div></div>':'')+
 '</aside></div></div></section>';
}

/* ---------- ROUTER ---------- */
var spy=null,act='home',pill=$('#pill'),links=$$('#dock a');
function movePill(){var a=$('#dock a[data-s="'+act+'"]');if(a){pill.style.width=a.offsetWidth+'px';pill.style.transform='translateX('+a.offsetLeft+'px)'}}
function setAct(id){act=id;links.forEach(function(l){l.classList.toggle('on',l.dataset.s===id)});movePill()}
function meta(title,desc){document.title=title;$('#metaDesc').setAttribute('content',desc||DESC0)}
function bindTilt(){$$('.tilt').forEach(function(c){
 c.addEventListener('mousemove',function(e){var r=c.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
  c.style.setProperty('--gx',x+'px');c.style.setProperty('--gy',y+'px');
  c.style.transform='perspective(900px) rotateX('+((y/r.height-.5)*-5).toFixed(2)+'deg) rotateY('+((x/r.width-.5)*5).toFixed(2)+'deg)'});
 c.addEventListener('mouseleave',function(){c.style.transform=''})})}
function scrollHash(){
 var h=location.hash&&document.getElementById(location.hash.slice(1));
 if(h)h.scrollIntoView();else window.scrollTo(0,0);
}
function route(){
 if(spy){spy.disconnect();spy=null}
 var p=location.pathname.replace(/\/+$/,'')||'/',m,app=$('#app');
 if(p==='/'){
  app.innerHTML=homeView();meta(C.brand+' - Semua layanan Sora, satu pintu');setAct('home');homeInit();
 }else if(p==='/aplikasi'){
  app.innerHTML=listView();meta('Aplikasi Android - '+C.brand,'Daftar aplikasi APK resmi '+C.brand+' untuk Android.');setAct('aplikasi');
 }else if((m=p.match(/^\/aplikasi\/info\/([^\/]+)$/))){
  var a=C.apps.filter(function(x){return x.slug===decodeURIComponent(m[1])})[0];
  if(!a){history.replaceState(null,'','/aplikasi');return route()}
  app.innerHTML=appView(a);meta(a.name+' APK Android - '+C.brand,a.desc);setAct('aplikasi');
 }else{
  history.replaceState(null,'','/');return route();
 }
 bindTilt();scrollHash();
}
function go(url){
 var u=new URL(url,location.origin);
 if(u.pathname===location.pathname&&u.hash){history.pushState(null,'',u.pathname+u.hash);scrollHash();return}
 history.pushState(null,'',u.pathname+u.hash);route();
}
document.addEventListener('click',function(e){
 if(e.defaultPrevented||e.button||e.metaKey||e.ctrlKey||e.shiftKey)return;
 var a=e.target.closest('a[data-link]');
 if(a){e.preventDefault();go(a.getAttribute('href'));return}
 var s=e.target.closest('[data-soon]');if(s){$('#soon').showModal();return}
 var b=e.target.closest('[data-pv]');if(b)openPv(+b.dataset.pv);
});
addEventListener('popstate',route);
addEventListener('resize',movePill);

/* dialog pratinjau */
var pv=$('#pv');
function openPv(i){var s=C.services[i];$('#pvt').textContent=s.name;$('#pvurl').textContent=s.url;$('#pvsk').innerHTML=media(s,true);$('#pvgo').href=s.url;pv.showModal()}
$('#pvx').addEventListener('click',function(){pv.close()});
pv.addEventListener('close',function(){$('#pvsk').innerHTML=''});
var soon=$('#soon');
[pv,soon].forEach(function(d){d.addEventListener('click',function(e){if(e.target===d)d.close()})});
$('#soonX').addEventListener('click',function(){soon.close()});

/* musik latar (tetap menyala saat pindah halaman) */
var mus=$('#mus'),au=null,yt=null,paused=false,idx=0,MS=C.MUSIC_URL?[].concat(C.MUSIC_URL).filter(Boolean):[];
function ytId(u){var m=String(u).match(/(?:youtu\.be\/|[?&]v=|embed\/)([\w-]{11})/);return m&&m[1]}
function setM(on){mus.setAttribute('aria-pressed',on)}
function playing(){return yt?!!(yt.getPlayerState&&yt.getPlayerState()===1):!!(au&&!au.paused)}
function first(e){if(e&&e.target&&e.target.closest&&e.target.closest('#mus'))return;disarm();if(!paused)go2()}
function arm(){['pointerdown','keydown','touchstart'].forEach(function(ev){addEventListener(ev,first,{passive:true})})}
function disarm(){['pointerdown','keydown','touchstart'].forEach(function(ev){removeEventListener(ev,first)})}
function go2(){
 if(yt){if(yt.playVideo){yt.playVideo();setTimeout(function(){if(!playing()&&!paused)arm()},900)}return}
 if(au)au.play().then(function(){setM(true)}).catch(function(){setM(false);arm()});
}
if(MS.length){
 mus.classList.add('show');
 var vid=ytId(MS[0]);
 if(vid){
  var box=document.createElement('div');
  box.style.cssText='position:fixed;left:-9999px;top:0;width:200px;height:200px;pointer-events:none';
  box.innerHTML='<div id="ytm"></div>';document.body.appendChild(box);
  window.onYouTubeIframeAPIReady=function(){
   yt=new YT.Player('ytm',{width:200,height:200,videoId:vid,playerVars:{autoplay:1,controls:0,playsinline:1,rel:0,loop:1,playlist:vid},events:{
    onReady:function(){yt.setVolume(Math.round((C.MUSIC_VOLUME||.5)*100));go2()},
    onStateChange:function(e){var st=e.data;if(st===1)setM(true);else if(st===2||st===5||st===-1)setM(false);if(st===0)yt.playVideo()},
    onError:function(){mus.classList.remove('show');disarm()}}});
  };
  var sc=document.createElement('script');sc.src='https://www.youtube.com/iframe_api';sc.async=true;document.head.appendChild(sc);
 }else{
  au=new Audio(MS[0]);au.volume=C.MUSIC_VOLUME||.5;au.loop=MS.length===1;au.preload='auto';
  au.addEventListener('ended',function(){idx=(idx+1)%MS.length;au.src=MS[idx];au.play().catch(function(){})});
  go2();
 }
 mus.addEventListener('click',function(){
  if(!yt&&!au)return;
  if(playing()){paused=true;disarm();if(yt)yt.pauseVideo();else au.pause();setM(false)}
  else{paused=false;disarm();go2()}
 });
}

route();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(movePill);
})();
</script>
